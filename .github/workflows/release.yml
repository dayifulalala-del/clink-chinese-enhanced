name: Publish Clink Chinese Enhanced
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, e.g. v0.4.0
        required: true
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Wanxiang dictionaries
        run: |
          git clone --depth 1 --branch wanxiang https://github.com/amzxyz/rime-wanxiang.git /tmp/wanxiang
          curl -fsSL -o /tmp/zh.emoji.json https://raw.githubusercontent.com/anti-ltd/clink-language-packs/main/Lexicons/zh.emoji.json
      - name: Build pack from Wanxiang + sources
        run: |
          python3 tools/import_wanxiang.py
          python3 tools/build-ime-table.py zh_cn source/zh_cn-ime.tsv
          python3 build-pack.py zh_cn source/zh_cn.txt
          python3 tools/build-next-word.py zh_cn source/zh_cn.txt source/zh_cn.sentences.txt
          python3 tools/validate-pack.py zh_cn
      - name: Build release manifest
        run: |
          V="${{ inputs.version || github.ref_name }}"
          rm -rf out && mkdir out
          python3 tools/build-release-manifest.py "$V" "${{ github.repository }}" out
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ inputs.version || github.ref_name }}"
          gh release view "$V" >/dev/null 2>&1 || gh release create "$V" --title "$V" --generate-notes
          find out -type f -print0 | while IFS= read -r -d '' f; do gh release upload "$V" "$f" --clobber; done
